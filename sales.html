<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales — Titan Coffee Run (Admin)</title>
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    .wrap{max-width:900px;margin:2rem auto;padding:1rem}
    .chart-box{background:#fff;padding:1rem;border-radius:8px}
    .btn{display:inline-block;padding:.5rem .75rem;border-radius:6px;background:#222;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <header role="banner">
    <a href="/" class="brand" aria-label="Titan Coffee Run home">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:800">Titan Coffee Run</div>
        <div style="font-size:.85rem;color:var(--muted)">Fresh. Fast. Friendly.</div>
      </div>
    </a>
    <nav role="navigation" aria-label="Primary navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="menu.html">Menu</a>
      <a href="locations.html">Locations</a>
      <a href="contact.html">Contact</a>
      <a href="apply.html" class="nav-cta">Apply for Credit</a>
      <a href="login.html" class="nav-link nav-login" id="nav-login">Login</a>
      <a href="register.html" class="nav-link nav-register" id="nav-register">Sign up</a>
      <a href="sales.html" id="nav-sales" style="display:none">Sales</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Sales (Admin)</h1>
    <p>This page is protected for admin users. You will be redirected to sign-in if not authenticated.</p>

    <div id="chart-container" class="chart-box" aria-live="polite" aria-label="Sales chart container">
      <!-- SVG placeholder for sales graph -->
      <svg id="chart-area" role="img" aria-label="Sales bar chart" style="width:100%;height:300px"></svg>
    </div>

    <div style="margin-top:1rem" class="chart-input">
      <label for="sales-input" style="display:block;margin-bottom:.5rem">Enter sales data (comma or newline separated). Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to update chart.</label>
      <textarea id="sales-input" rows="4" style="width:100%;padding:.5rem;font-family:monospace;">40, 80, 150, 160, 230, 420</textarea>
      <div style="margin-top:.5rem;display:flex;gap:.5rem">
        <button id="sendBtn" class="btn">Update Chart (Ctrl+Enter)</button>
        <div id="inputStatus" style="align-self:center;color:var(--muted)"></div>
      </div>
    </div>

    <div style="margin-top:1rem;display:flex;gap:.5rem;align-items:center">
      <button id="logoutBtn" class="btn">Logout</button>
      <button id="resetBtn" class="btn" style="background:#666">Reset</button>
      <div id="statusMsg" style="margin-left:1rem;color:var(--muted)"></div>
    </div>
  </main>

  <script>
    // Protect page: redirect non-admins to login
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
      try { sessionStorage.setItem('intended', location.pathname); } catch(e){}
      location.replace('login.html');
    }

    // Toggle top nav state: replace Login with Admin Logged in when appropriate
    (function toggleNav(){
      try {
        const isAdmin = localStorage.getItem('adminLoggedIn') === 'true';
        const navLogin = document.getElementById('nav-login');
        const navSales = document.getElementById('nav-sales');
        if (navLogin) {
          if (isAdmin) {
            navLogin.textContent = 'Admin Logged in';
            navLogin.removeAttribute('href');
            navLogin.setAttribute('aria-current','false');
            navLogin.style.opacity = '0.85';
            navLogin.style.pointerEvents = 'none';
          } else {
            navLogin.textContent = 'Login';
            navLogin.href = 'login.html';
            navLogin.style.pointerEvents = '';
            navLogin.style.opacity = '';
          }
        }
        // Replace Sign up text with 'Admin' while admin is logged in
        try {
          const navRegister = document.getElementById('nav-register');
          if (navRegister) navRegister.textContent = isAdmin ? 'Admin' : 'Sign up';
        } catch(e){}
        if (navSales) navSales.style.display = isAdmin ? '' : 'none';
      } catch(e){/* ignore */}
    })();

    // Chart rendering moved to `src/js/sales-graph.js` to keep logic modular.

    document.getElementById('logoutBtn').addEventListener('click', ()=>{
      localStorage.removeItem('adminLoggedIn');
      location.replace('login.html');
    });

    // Reset button: clears admin flag and any demo storage items (keeps user in page)
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      localStorage.removeItem('adminLoggedIn');
      // clear any demo graph-related keys here if needed later
      const status = document.getElementById('statusMsg');
      if (status) status.textContent = 'Admin state reset; reload to re-login.';
    });

    // Handle sales data input: Enter inserts newline (default); Ctrl+Enter sends/updates chart
    (function wireInput(){
      const ta = document.getElementById('sales-input');
      const send = document.getElementById('sendBtn');
      const inputStatus = document.getElementById('inputStatus');
      if (!ta || !send) return;

      function parseAndUpdate(){
        const raw = ta.value || '';
        // allow comma or newline separated values
        const parts = raw.split(/[,\n]+/).map(s => s.trim()).filter(s=>s.length);
        const nums = parts.map(n=>Number(n)).filter(x => Number.isFinite(x));
        if (!nums.length) {
          if (inputStatus) inputStatus.textContent = 'No valid numbers found.';
          return;
        }
        // update global and call update function
        try { window.salesDate = nums.slice(); } catch(e){}
        try { if (typeof window.updateSalesData === 'function') window.updateSalesData(nums); } catch(e){}
        if (inputStatus) inputStatus.textContent = 'Chart updated.';
      }

      ta.addEventListener('keydown', (ev)=>{
        if (ev.key === 'Enter' && ev.ctrlKey) {
          ev.preventDefault();
          parseAndUpdate();
        }
        // Otherwise Enter inserts newline in textarea by default
      });

      send.addEventListener('click', (ev)=>{
        ev.preventDefault();
        parseAndUpdate();
      });
    })();
  </script>
  <script type="module" src="./src/js/sales-graph.js"></script>
</body>
</html>
