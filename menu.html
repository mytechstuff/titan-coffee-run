<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu — Titan Coffee Run (Demo)</title>
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    .menu-wrap{ max-width:900px; margin:24px auto; padding:16px }
    .menu-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px }
    .menu-card{ background:#ffffff;padding:12px;border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.04) }
    /* Cart box uses a warm background to stand out from product cards */
    .cart-box{ background:#fff8e6; padding:12px; border-radius:8px; border:1px solid rgba(0,0,0,0.04) }
    .menu-card h3{ margin:8px 0 6px }
    .menu-card .price{ font-weight:700; margin-top:6px }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header role="banner">
    <a href="/" class="brand" aria-label="Titan Coffee Run home">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:800">Titan Coffee Run</div>
        <div style="font-size:.85rem;color:var(--muted)">Fresh. Fast. Friendly.</div>
      </div>
    </a>
    <nav role="navigation" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/menu.html" aria-current="page">Menu</a>
      <a href="/locations.html">Locations</a>
      <a href="/contact.html">Contact</a>
      <a href="/login.html">Sign in</a>
    </nav>
  </header>

  <main id="main-content">
    <div class="menu-wrap">
      <h1>Our Menu Order Page</h1>
      <p class="note">This demo page requires signing in. If you are redirected to login, sign in with the demo account and you'll return here.</p>

      <div id="menuArea">
        <!-- menu content will be injected if authenticated -->
      </div>
    </div>
  </main>

  <script type="module">
    import SessionManager from './src/js/sessionManager.js';
    import { Cart, renderCartInto } from './src/js/cart.js';

    (function(){
      const sm = new SessionManager();
      const t = sm.getToken();
      const loggedIn = !!t && sm.validateToken(t).valid;

      const products = [
        { id: 'latte', name: 'Titan Latte', desc: 'Our signature latte — rich and smooth.', basePrice: 4.25, img: 'public/assets/img/carousel-1.jpg' },
        { id: 'nitro', name: 'Nitro Cold Brew', desc: 'Bold, cold, and nitrogen-infused.', basePrice: 4.75, img: 'public/assets/img/carousel-2.jpg' },
        { id: 'americano', name: 'Americano', desc: 'Espresso with hot water — simple and classic.', basePrice: 3.00, img: 'public/assets/img/carousel-3.jpg' },
        { id: 'almond', name: 'Almond Milk Capp', desc: 'Foamy and dairy-free option.', basePrice: 4.50, img: 'public/assets/img/carousel-4.png' },
        { id: 'mocha', name: 'Chocolate Mocha', desc: 'Velvety mocha with dark chocolate.', basePrice: 4.95, img: 'public/assets/img/titanquad1.jpg' },
        { id: 'coldbrew', name: 'House Cold Brew', desc: 'Slow-steeped for smooth flavor.', basePrice: 3.95, img: 'public/assets/img/banner-hero.jpg' }
      ];

      const menuArea = document.getElementById('menuArea');

      function el(tag, cls, inner){ const e = document.createElement(tag); if (cls) e.className = cls; if (inner !== undefined) e.innerHTML = inner; return e; }

      const grid = el('div','menu-grid');
      products.forEach(p=>{
        const card = el('div','menu-card');
        const img = document.createElement('img'); img.src = p.img; img.alt = p.name; img.style.width = '100%'; img.style.height='140px'; img.style.objectFit='cover'; img.style.borderRadius='6px';
        card.appendChild(img);
        const h = el('h3','',''+p.name); card.appendChild(h);
        const d = el('p','',p.desc); card.appendChild(d);
        const price = el('div','price',`$${p.basePrice.toFixed(2)}`); card.appendChild(price);

        // Size selector & order controls (only visible when logged in)
        const controls = el('div','order-controls');
        // sizes
        const sizes = el('div','sizes');
        ['S','M','L'].forEach((s, idx)=>{
          const lbl = document.createElement('label');
          lbl.style.marginRight = '8px';
          const rb = document.createElement('input'); rb.type='radio'; rb.name = 'size-'+p.id; rb.value = s; if (s==='M') rb.checked = true; lbl.appendChild(rb); lbl.appendChild(document.createTextNode(' '+s));
          sizes.appendChild(lbl);
        });
        controls.appendChild(sizes);

        // quantity controls
        const qtyWrap = el('div','qty-wrap');
        const dec = el('button','dec','-'); dec.type='button';
        const qty = el('span','qty','0'); qty.style.margin='0 8px';
        const inc = el('button','inc','+'); inc.type='button';
        qtyWrap.appendChild(dec); qtyWrap.appendChild(qty); qtyWrap.appendChild(inc);
        controls.appendChild(qtyWrap);

        const addBtn = el('button','add','Add to cart'); addBtn.type='button';
        controls.appendChild(addBtn);

        // Hide controls if not logged in — show a sign-in prompt instead
        if (!loggedIn){
          controls.style.display = 'none';
          const signin = el('p','', '<a href="login.html">Sign in</a> to order');
          card.appendChild(signin);
        } else {
          card.appendChild(controls);
        }

        // Hook controls when logged in
        if (loggedIn){
          let curQty = 0;
            // increment: if item exists in cart, increase it there; otherwise increase local curQty
            inc.addEventListener('click', ()=>{
              const checked = card.querySelector('input[type=radio]:checked');
              const size = checked ? checked.value : 'M';
              const existing = Cart.getCart().items.find(i=> i.product && i.product.id === p.id && i.size === size);
              if (existing){
                Cart.updateQty(p.id, size, (existing.qty||0) + 1);
                renderCartInto(document.querySelector('.cart-box'));
              } else {
                curQty++; qty.textContent = String(curQty);
              }
            });
            // decrement: if item exists in cart, decrement it; otherwise decrement local curQty
            dec.addEventListener('click', ()=>{
              const checked = card.querySelector('input[type=radio]:checked');
              const size = checked ? checked.value : 'M';
              const existing = Cart.getCart().items.find(i=> i.product && i.product.id === p.id && i.size === size);
              if (existing){
                const newQ = Math.max(0, (existing.qty||0) - 1);
                Cart.updateQty(p.id, size, newQ);
                renderCartInto(document.querySelector('.cart-box'));
              } else {
                curQty = Math.max(0, curQty-1); qty.textContent = String(curQty);
              }
            });
            addBtn.addEventListener('click', ()=>{
              const checked = card.querySelector('input[type=radio]:checked');
              const size = checked ? checked.value : 'M';
              const q = Math.max(1, Number(qty.textContent) || 1);
              Cart.addItem({ id: p.id, name: p.name, basePrice: p.basePrice, size, qty: q });
              // reset qty
              curQty = 0; qty.textContent = '0';
              // update cart UI if present
              const cartBoxEl = document.querySelector('.cart-box');
              if (cartBoxEl) renderCartInto(cartBoxEl);
              addBtn.textContent = 'Added ✓';
              setTimeout(()=> addBtn.textContent = 'Add to cart', 900);
            });
        }

        grid.appendChild(card);
      });

      menuArea.appendChild(grid);

      // Cart summary area: use a distinct background so it stands out from product cards
      const cartBox = document.createElement('aside'); cartBox.className = 'cart-box'; cartBox.style.marginTop='16px';
      // Use a two-column layout: left = items, right = totals and actions
      cartBox.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;margin-right:12px">
            <h3>Your Cart</h3>
            <div id="cartItems">Cart is empty.</div>
          </div>
          <div style="width:220px">
            <h3>Checkout</h3>
            <div id="cartTotals"></div>
            <div style="margin-top:8px">
              <button id="clearCartBtn" type="button">Clear Cart</button>
            </div>
          </div>
        </div>
      `;
      menuArea.appendChild(cartBox);
      // render saved cart
      renderCartInto(cartBox);
      const clearBtn = document.getElementById('clearCartBtn');
      if (clearBtn) clearBtn.addEventListener('click', ()=>{ Cart.clear(); renderCartInto(cartBox); });

    })();
  </script>
</body>
</html>
