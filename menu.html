<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu — Titan Coffee Run (Demo)</title>
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    .menu-wrap{ max-width:900px; margin:24px auto; padding:16px }
    .menu-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:12px }
    .menu-card{ background:#fff;padding:12px;border-radius:8px }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header role="banner">
    <a href="/" class="brand" aria-label="Titan Coffee Run home">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:800">Titan Coffee Run</div>
        <div style="font-size:.85rem;color:var(--muted)">Fresh. Fast. Friendly.</div>
      </div>
    </a>
    <nav role="navigation" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/menu.html" aria-current="page">Menu</a>
      <a href="/locations.html">Locations</a>
      <a href="/contact.html">Contact</a>
      <a href="/login.html">Sign in</a>
    </nav>
  </header>

  <main id="main-content">
    <div class="menu-wrap">
      <h1>Our Menu (Protected Demo)</h1>
      <p class="note">This demo page requires signing in. If you are redirected to login, sign in with the demo account and you'll return here.</p>

      <div id="menuArea">
        <!-- menu content will be injected if authenticated -->
      </div>
    </div>
  </main>

  <script type="module">
    import SessionManager from './src/js/sessionManager.js';
    (function(){
      const sm = new SessionManager();
      const t = sm.getToken();
      if (!t) {
        sessionStorage.setItem('intended', location.pathname + location.search);
        location.replace('login.html');
        return;
      }
      // Use SessionManager to validate token
      const check = sm.validateToken(t);
      if (!check.valid) {
        sessionStorage.setItem('intended', location.pathname + location.search);
        location.replace('login.html');
        return;
      }

      const menuArea = document.getElementById('menuArea');
      menuArea.innerHTML = `
        <div class="menu-grid">
          <div class="menu-card"><h3>Titan Latte</h3><p>Our signature latte — rich and smooth.</p><strong>$4.25</strong></div>
          <div class="menu-card"><h3>Nitro Cold Brew</h3><p>Bold, cold, and nitrogen-infused.</p><strong>$4.75</strong></div>
          <div class="menu-card"><h3>Americano</h3><p>Espresso with hot water — simple and classic.</p><strong>$3.00</strong></div>
          <div class="menu-card"><h3>Almond Milk Capp</h3><p>Foamy and dairy-free option.</p><strong>$4.50</strong></div>
        </div>
        <p style="margin-top:1rem"><a href="protected.html">Go to protected test page</a></p>
      `;
    })();
  </script>
</body>
</html>
