<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Password Reset - Titan Coffee Run</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    .reset-card{max-width:480px;margin:3rem auto;padding:1.25rem;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .field{margin-bottom:.75rem}
    label{display:block;font-weight:600;margin-bottom:.25rem}
    input[type=text],input[type=email]{width:100%;padding:.6rem;border:1px solid #e5e7eb;border-radius:6px}
    .btn{display:inline-block;padding:.6rem .9rem;background:#1f2937;color:#fff;border-radius:6px;border:none;cursor:pointer}
    .msg{margin-top:.75rem;color:#374151}
  </style>
</head>
<body>
  <main>
    <div class="reset-card">
      <h2>Password Reset</h2>
      <p>Enter your email and we'll send a password reset link if an account exists. For security we do not reveal whether an account was found.</p>
      <form id="pwResetForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required />
          <div id="emailError" class="msg" aria-live="polite"></div>
        </div>
        <button id="sendBtn" class="btn" type="submit">Send Reset Link</button>
        <div id="formStatus" class="msg" aria-live="polite"></div>
      </form>
    </div>
  </main>
  <script type="module" src="src/js/password-reset.js"></script>
</body>
</html>
