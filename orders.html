<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Orders — Titan Coffee Run (Demo)</title>
  <link rel="stylesheet" href="./src/styles/main.css">
  <style>
    .orders-wrap { max-width:1000px; margin:24px auto; padding:16px }
    .orders-controls { margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap }
    .orders-controls input { padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:1rem }
    .orders-controls button { padding:6px 12px; background:#333; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:1rem }
    .orders-controls button:hover { background:#555 }
    #ordersContainer { margin-top:16px }
    .status-msg { padding:8px; border-radius:4px; margin-bottom:12px; font-size:0.95rem }
    .status-msg.loading { background:#e3f2fd; color:#1565c0 }
    .status-msg.error { background:#ffebee; color:#c62828 }
    .status-msg.success { background:#e8f5e9; color:#2e7d32 }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header role="banner">
    <a href="/" class="brand" aria-label="Titan Coffee Run home">
      <div class="logo">T</div>
      <div>
        <div style="font-weight:800">Titan Coffee Run</div>
        <div style="font-size:.85rem;color:var(--muted)">Fresh. Fast. Friendly.</div>
      </div>
    </a>
    <nav role="navigation" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/menu.html">Menu</a>
      <a href="/orders.html" aria-current="page">Orders</a>
      <a href="/login.html">Sign in</a>
    </nav>
  </header>

  <main id="main-content">
    <div class="orders-wrap">
      <h1>Order History</h1>
      <p class="note">Browse all orders placed through the Titan Coffee Run system.</p>

      <!-- Controls for filtering and refreshing -->
      <div class="orders-controls">
        <input type="text" id="searchInput" placeholder="Search by customer name..." style="flex:1;min-width:200px" />
        <button id="searchBtn" type="button">Search</button>
        <button id="clearSearchBtn" type="button">Clear</button>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>

      <!-- Status message area -->
      <div id="statusArea"></div>

      <!-- Orders table will be injected here -->
      <div id="ordersContainer"></div>
    </div>
  </main>

  <footer>
    <p>&copy; Titan Coffee Run</p>
  </footer>

  <script type="module">
    import { Orders, renderOrdersInto } from './src/js/orders.js';

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusArea = document.getElementById('statusArea');
    const ordersContainer = document.getElementById('ordersContainer');

    /**
     * showStatus
     * Display a status message in the status area.
     */
    function showStatus(message, type = 'success') {
      statusArea.innerHTML = `<div class="status-msg ${type}">${message}</div>`;
      if (type === 'error') setTimeout(() => statusArea.innerHTML = '', 5000);
    }

    /**
     * loadAndRender
     * Fetch orders and render them into the container.
     */
    async function loadAndRender() {
      showStatus('Loading orders...', 'loading');
      const orders = await Orders.fetchAll();
      if (!orders || orders.length === 0) {
        showStatus('No orders found or failed to load.', 'error');
      } else {
        showStatus(`Loaded ${orders.length} order(s)`, 'success');
        renderOrdersInto(ordersContainer, orders);
      }
    }

    /**
     * searchByName
     * Search for orders by customer name.
     */
    async function searchByName() {
      const term = searchInput.value.trim();
      if (!term) {
        showStatus('Please enter a search term.', 'error');
        return;
      }
      showStatus(`Searching for "${term}"...`, 'loading');
      const results = await Orders.filterByName(term);
      if (results.length === 0) {
        showStatus(`No orders found for "${term}".`, 'error');
      } else {
        showStatus(`Found ${results.length} order(s)`, 'success');
        renderOrdersInto(ordersContainer, results);
      }
    }

    /**
     * clearSearch
     * Clear search input and reload all orders.
     */
    async function clearSearch() {
      searchInput.value = '';
      Orders.clearCache();
      await loadAndRender();
    }

    /**
     * refresh
     * Manually refresh orders from the backend.
     */
    async function refresh() {
      Orders.clearCache();
      await loadAndRender();
    }

    // Attach event listeners
    searchBtn.addEventListener('click', searchByName);
    clearSearchBtn.addEventListener('click', clearSearch);
    refreshBtn.addEventListener('click', refresh);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchByName();
    });

    // Load initial orders on page load
    loadAndRender();
  </script>
</body>
</html>
